<!DOCTYPE html>
<html>
<head>

<title>Nagaon Car Rental Service</title>

<meta name="description" content="Affordable Car Rental With Driver in Nagaon, Assam">

<style>

body{
font-family: Arial;
background:#f4f4f4;
padding:20px;
text-align:center;
}

.box{
background:white;
padding:20px;
border-radius:15px;
max-width:500px;
margin:auto;
}

img{
width:100%;
border-radius:15px;
}

input, select, button{
width:90%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:black;
color:white;
font-size:16px;
}

</style>

</head>

<body>

<div class="box">

<h1>Nagaon Car Rental Service</h1>

<h2>Maruti Swift VXI 2016</h2>

<p>Pickup & Drop Service Available</p>

<p>Single Trip & Round Trip</p>

<p>Customer must send ID proof on WhatsApp after booking.</p>

<h2>Booking Form</h2>

<input type="text" id="name" placeholder="Your Name">

<input type="tel" id="phone" placeholder="Phone Number">

<input type="text" id="pickup" placeholder="Pickup Location">

<input type="text" id="drop" placeholder="Drop Location">

<label>Trip Type</label>

<select id="triptype">
<option>Single Trip</option>
<option>Round Trip</option>
</select>

<label>Trip Date</label>

<input type="date" id="date">

<label>Return Date</label>

<input type="date" id="returndate">

<button onclick="sendWhatsApp()">
Send Booking on WhatsApp
</button>

</div>

<script>

function sendWhatsApp() {

let name = document.getElementById('name').value;

let phone = document.getElementById('phone').value;

let pickup = document.getElementById('pickup').value;

let drop = document.getElementById('drop').value;

let triptype = document.getElementById('triptype').value;

let date = document.getElementById('date').value;

let returndate = document.getElementById('returndate').value;

let message =
"Booking Request:%0A%0A" +

"Name: " + name + "%0A" +

"Phone: " + phone + "%0A" +

"Pickup: " + pickup + "%0A" +

"Drop: " + drop + "%0A" +

"Trip Type: " + triptype + "%0A" +

"Trip Date: " + date + "%0A" +

"Return Date: " + returndate;

window.open(
"https://wa.me/919707555891?text=" + message,
"_blank"
);

}

</script>

</body>
</html>
